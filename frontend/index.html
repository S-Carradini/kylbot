
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Kyl Center Bot</title>
      <meta name="description" content="Explore Arizona&#39;s water resources with an AI assistant that provides interactive maps, smart search capabilities, and real-time data for informed decision-making." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        // Applied synchronously, before first paint — the /widget route is
        // loaded inside a transparent host iframe (see waterbot-embed.js) and
        // must never show its own opaque background, not even for the brief
        // moment before React mounts and the app's own effects would
        // otherwise add this class.
        if (location.pathname === "/widget") {
          document.documentElement.classList.add("wb-widget-mode");
        }
      </script>

    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
